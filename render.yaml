services:
  - type: web
    name: leap-api
    plan: free
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: ENVIRONMENT
        value: production
      - key: LEAP_COLLECTION_MODE
        value: pilot
      - key: WORLD_MODEL_ENABLED
        value: false
      - key: CODAPI_URL
        value: https://api.codapi.org/v1/exec
      - key: CODAPI_TOKEN
        sync: false
      - key: CODE_EXECUTION_ENGINE
        value: codapi
      - key: CODE_EXECUTION_MAX_DATASET_BYTES
        value: 200000
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_ORIGINS
        sync: false
      - key: TUTOR_LLM_PROVIDER
        value: openrouter
      - key: OPENROUTER_CHAT_URL
        value: https://openrouter.ai/api/v1/chat/completions
      - key: OPENROUTER_MODEL
        value: openai/gpt-oss-20b
      - key: OPENROUTER_API_KEY
        sync: false
