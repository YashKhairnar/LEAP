services:
  - type: web
    name: leap-api
    plan: free
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: ENVIRONMENT
        value: production
      - key: LEAP_COLLECTION_MODE
        value: pilot
      - key: WORLD_MODEL_ENABLED
        value: false
      - key: CODE_EXECUTION_ENGINE
        value: modal
      - key: MODAL_SANDBOX_URL
        sync: false
      - key: MODAL_SANDBOX_TOKEN
        sync: false
      - key: MODAL_SANDBOX_TIMEOUT_SECONDS
        value: 50
      - key: CODE_EXECUTION_MAX_DATASET_BYTES
        value: 12000
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_ORIGINS
        sync: false
      - key: TUTOR_LLM_PROVIDER
        value: gemini
      - key: GEMINI_API_URL
        value: https://generativelanguage.googleapis.com/v1beta/models/{model}:generateContent
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_FALLBACK_MODEL
        value: gemini-3.6-flash
      - key: GEMINI_RETRIES
        value: 1
      - key: GEMINI_API_KEY
        sync: false
