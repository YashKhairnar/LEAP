[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "leap-research"
version = "0.1.0"
description = "Learning trajectory research from programming submissions"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "torch>=2.2",
]

[project.optional-dependencies]
models = ["transformers>=4.40"]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

